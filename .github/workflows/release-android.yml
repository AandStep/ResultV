name: Release Android

on:
  push:
    tags:
      - 'android-v*' # Отдельный Android-релиз, напр. android-v1.0.0

jobs:
  build-android:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      # Тег android-v1.2.3 → VERSION_NAME=1.2.3, VERSION_CODE=10203
      # (major*10000 + minor*100 + patch). Эти значения уезжают в gradle
      # через -PversionName / -PversionCode и становятся версией APK.
      - name: Derive version from tag
        id: version
        run: |
          TAG="${GITHUB_REF_NAME}"            # android-v1.2.3
          VERSION="${TAG#android-v}"          # 1.2.3
          IFS='.' read -r MAJ MIN PAT <<< "$VERSION"
          MAJ=${MAJ:-0}; MIN=${MIN:-0}; PAT=${PAT:-0}
          CODE=$(( MAJ * 10000 + MIN * 100 + PAT ))
          echo "name=$VERSION" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "Android version: $VERSION (code $CODE)"

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install gomobile (sagernet fork)
        run: |
          go install github.com/nicedayzhu/nicedayzhu-gomobile/cmd/gomobile@v0.1.12
          go install github.com/nicedayzhu/nicedayzhu-gomobile/cmd/gobind@v0.1.12
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Initialize gomobile
        run: gomobile init

      - name: Build AAR
        env:
          SUBSCRIPTION_ENCRYPT_KEY: ${{ secrets.SUBSCRIPTION_ENCRYPT_KEY }}
        run: |
          chmod +x scripts/build-android-aar.sh
          ./scripts/build-android-aar.sh

      - name: Decode release keystore
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/release.keystore

      - name: Create keystore.properties
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          cat > android/keystore.properties <<EOF
          storeFile=../release.keystore
          storePassword=$ANDROID_STORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF

      - name: Build release APKs
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon \
            -PversionName=${{ steps.version.outputs.name }} \
            -PversionCode=${{ steps.version.outputs.code }}

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-assets-android
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 1
          if-no-files-found: error

  create-release:
    needs: [build-android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read

    steps:
      - name: Download Android assets
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: release-assets-android
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ResultV Android ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          files: release-assets/*.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
